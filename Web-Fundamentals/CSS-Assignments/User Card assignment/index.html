<!DOCTYPE html>
<html lang="en">
    <head>
        <title>User Card</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <div class="top-nav"></div>
            <div class="bot-nav">
                <h1>Jane Doe</h1>

            </div>
        </div>
    </body>
</html>
