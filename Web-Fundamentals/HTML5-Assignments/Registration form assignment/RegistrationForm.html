<!DOCTYPE html>
<html>
    <head>
        <title>Registration Form</title>
    </head>
    <body>
        <h1>Registration Form</h1>
        <form>
            <label for="first-name">First Name*</label>
            <input type="text" name="first_name" id="first-name"/>
            <label for="last-name">Last Name*</label>
            <input type="text" name="last_name" id="last-name"/>
            <br> <br>
            <label for="email">Email Address*</label>
            <input type="email" name="email" id="email"/>
            <br> <br>
            <label for="password">Password*</label>
            <input type="password" name="password" id="password"/>
            <br> <br>
            <label for="confirm-password">Confirm Password*</label>
            <input type="password" name="confirm_password" id="confirm-password"/></p>
        
            <label for="birthday">Birthday</label>
            <input type="date" name="birthday" id="birthday"/>

            <fieldset>
                <legend>Gender Identity:</legend>
                <input type="radio" name="gender" value="Male" id="male"/>
                <label for="male">Male</label>
                <input type="radio" name="gender" value="Female" id="female"/>
                <label for="female">Female</label>
                <input type="radio" name="gender" value="non-binary" id="non-binary"/>
                <label for="non-binary">Non-Binary</label>
                <input type="radio" name="gender" value="Iprefer not to say" id="i-prefer-not-to-say"/>
                <label for="i-prefer-not-to-say">I prefer not to say</label>
            </fieldset>
            <fieldset>
                <legend>Favorite Language</legend>
                <select>
                    <option value="html" >HTML</option>
                    <option value="css">CSS</option>
                    <option value="javascript">JavaScript</option>
                </select>
            </fieldset>
            <label for="description">A short description about myself</label>
            <textarea name="bio" rows="3" id="description"></textarea>
            <br> <br>
            <input type="checkbox" name="Receive email updates" value="yes" id="receive-updates"/>
            <label for="receive-updates">Yes, I would like to receive periodic email updates.</label>
            <br> <br>
            <label for="submit"></label>
            <input type="submit" value="Create Account" id="submit"/>
            <p><em>* indicates required fields</em></p>
    </form>

    </body>

</html>
