<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style1.css">
    <title>Likes WebSite</title>
</head>
<body>
    <div class="first-nav"><h2>Network</h2></div>
    <div class="sec-nav"><h2>Your Feed</h2></div>
    <div class="container">
        <div class="user-side">
            <div class="user-box">
                <div class="profile-pic">
                    <img src="icons/user-circle.png" alt="icon">
                </div>
                <a href="#">Add an avatar</a>
                <h2>James Doe</h2>
            </div>
        </div>
        <div class="posts-side">
            <div class="post">
                <div class="topPost-box">
                    <div class="poster-name"><h3>Neil M</h3></div>
                    <div class="like-btn">
                        <p><span id="countNeil">0</span> like(s)</p>
                        <button class="likeBtnNeil">Like</button>
                    </div>
                </div>
                <div class="post-text"><p>I just set up this new discord bot, let me know what you all think. <a href="#">link</a></p>
                </div>
            </div>
            <div class="post">
                <div class="topPost-box">
                    <div class="poster-name"><h3>Nichole K</h3></div>
                    <div class="like-btn">
                        <p><span id="countNichol">0</span> like(s)</p>
                        <button class="likeBtnNichol">Like</button>
                    </div>
                </div>
                <div class="post-text">
                    <p>Just finished my <a href="#">next comic</a>, check it out</p>
                </div>
            </div>
            <div class="post">
                <div class="topPost-box">
                    <div class="poster-name"><h3>Jim R</h3></div>
                    <div class="like-btn">
                        <p><span id="countJim">0</span> like(s)</p>
                        <button class="likeBtnJim">Like</button>
                    </div>
                </div>
                <div class="post-text"><p>I can't stop listening to the <a href="#">new album</a>. Who else is liking it</p>
                </div>
            </div>
        </div>
    </div>


    <script src="script1.js"></script>
</body>
</html>
